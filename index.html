<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Русский — Zakria's Russian</title>
<meta name="theme-color" content="#F6F1E7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#F6F1E7;--card:#FFFDF8;--ink:#211E1C;--soft:#8C847A;--line:#E4DACA;--acc:#B23A2E;--pr:#2E62A0;
--m:#2E62A0;--f:#C44070;--n:#2E8C5A;--pl:#7850AA;--adj:#C87814;--good:#2E8C5A;--again:#B23A2E;--hard:#C87814;--easy:#2E62A0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Fira Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:620px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:30px;margin:4px 0 0} h2{font-size:24px;margin:0} h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin:22px 0 8px}
.s{color:var(--acc)} .pr{color:var(--pr);font-weight:500;font-size:14px} .en{color:var(--soft)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center} .grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;background:var(--ink);color:#fff;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)} .btn.wide{width:100%}
.btn:disabled{opacity:.4}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-weight:500;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;color:#fff;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;vertical-align:2px}
.t-m{background:var(--m)} .t-f{background:var(--f)} .t-n{background:var(--n)} .t-pl{background:var(--pl)} .t-adj{background:var(--adj)} .t-verb{background:#555} .t-num{background:#2E62A0} .t-x{background:#999}
.c-m{color:var(--m)} .c-f{color:var(--f)} .c-n{color:var(--n)} .c-pl{color:var(--pl)}
.mk{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px} .mk b{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:24px;line-height:1.1} .stat span{font-size:12px;color:var(--soft)}
.due{background:var(--ink);color:#fff;border-radius:22px;padding:18px;margin:14px 0}
.due .n{font-size:40px;font-weight:700;line-height:1} .due .en{color:#cfc6ba}
.due .btn{background:#fff;color:var(--ink);margin-top:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{flex:1;max-width:150px;background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--soft);cursor:pointer}
nav.tabs button.on{color:var(--ink);font-weight:600} nav.tabs svg{width:24px;height:24px}
.pics{display:flex;justify-content:center;background:var(--bg);border-radius:20px;padding:12px}
.pics img{width:120px;height:120px;margin:0 -6px} .pics.one img{width:150px;height:150px}
.flash{text-align:center;min-height:420px;display:flex;flex-direction:column;gap:10px}
.flash .ru{font-size:34px;font-weight:600;line-height:1.2;margin-top:8px}
.flash .ensh{font-size:26px;font-weight:600;margin-top:8px}
.ans{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px;align-items:center}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto}
.grades button{border:0;border-radius:14px;padding:10px 4px;color:#fff;font-weight:600;cursor:pointer}
.grades small{display:block;font-weight:400;opacity:.85;font-size:12px}
.g1{background:var(--again)} .g2{background:var(--hard)} .g3{background:var(--good)} .g4{background:var(--easy)}
.spk{border:1px solid var(--line);background:var(--card);border-radius:99px;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.spk svg{width:22px;height:22px}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)} .item:first-child{border-top:0}
.item img{width:52px;height:52px;flex:none} .ims{display:flex;flex:none;background:var(--bg);border-radius:12px;padding:4px} .ims img{width:40px;height:40px;margin:0 -3px}
.word{font-size:20px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px} th,td{text-align:left;padding:5px 4px;border-top:1px solid var(--line);vertical-align:top} thead th{border-top:0;color:var(--soft);font-weight:600}
.note{background:#F9EFE3;border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px}
details summary{cursor:pointer;font-weight:600} details ul{margin:8px 0 0;padding-left:18px} details li{margin:4px 0}
label{display:block;font-size:13px;color:var(--soft);font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}
.prog{height:6px;background:var(--line);border-radius:9px;overflow:hidden} .prog i{display:block;height:100%;background:var(--good)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--soft);padding:30px 10px}
.kbd{font-size:12px;color:var(--soft);text-align:center;margin-top:8px}
a{color:var(--pr)}
</style>
</head>
<body>
<main id="app"><div class="empty">Loading…</div></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
// ---------------- helpers ----------------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stress = s => esc(s).replace(/(.́|ё|Ё)/g, '<span class="s">$1</span>');
const GN = {m:'masculine', f:'feminine', n:'neuter', pl:'plural', adj:'adjective', verb:'verb', x:'phrase', num:'number'};
function marked(t, g) { // {stem|end} highlighting
  const h = esc(t).replace(/\{([^}]*)\}/g, (_, inner) => {
    if (inner.includes('|')) { const [a, b] = inner.split('|'); return `<span class="mk c-${g}">${a}<b>${b}</b></span>`; }
    return `<span class="mk c-${g}"><b>${inner}</b></span>`;
  });
  return h.replace(/(.́|ё)/g, '<span class="s">$1</span>');
}
const MIN = 60000, DAY = 86400000;
const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const endOfToday = () => { const d = new Date(); d.setHours(23, 59, 59, 999); return d.getTime(); };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }
const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
  spk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>'
};

// ---------------- pronunciation (English letters, CAPS = stress) ----------------
const VOW = 'аеёиоуыэюя';
const CON = {б:'b',в:'v',г:'g',д:'d',ж:'zh',з:'z',й:'y',к:'k',л:'l',м:'m',н:'n',п:'p',р:'r',с:'s',т:'t',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ъ:'',ь:"'"};
const DEV = {б:'п',в:'ф',г:'к',д:'т',ж:'ш',з:'с'}; const HARD = 'шжц';
const SPECIAL = {'здра́вствуйте':'ZDRAST-vui-tye','что':'shto','сего́дня':'si-VOD-nya','пожа́луйста':'pa-ZHA-lus-ta','в':'v','с':'s','мне':'mnye','нет':'nyet','где':'gdye','друг':'druk','э́то':'E-ta','о':'a','не':'ni','по':'pa','у':'u','кого́':'ka-VO','чего́':'chi-VO'};
function wordTr(w) {
  let raw = w.toLowerCase();
  if (SPECIAL[raw]) return SPECIAL[raw];
  if (raw.includes('-')) return raw.split('-').map(wordTr).join('-');
  let stressI = raw.indexOf('́') >= 0 ? raw.indexOf('́') - 1 : -1;
  let s = raw.replace(/́/g, '');
  if (stressI < 0 && s.includes('ё')) stressI = s.indexOf('ё');
  if (s.startsWith('сд')) s = 'зд' + s.slice(2);
  for (const [pat, sub] of [['дц', 'ц'], ['стн', 'сн'], ['тьс', 'ц'], ['тс', 'ц']]) { let i; while ((i = s.indexOf(pat)) >= 0) { if (stressI > i) stressI -= pat.length - sub.length; s = s.slice(0, i) + sub + s.slice(i + pat.length); } }
  if (s.length > 4 && /(ого|его)$/.test(s) && !['много','дорого','строго'].includes(s)) s = s.slice(0, -2) + 'во';
  if (DEV[s[s.length - 1]]) s = s.slice(0, -1) + DEV[s[s.length - 1]];
  // collapse doubled consonants
  let t = ''; for (let i = 0; i < s.length; i++) { if (i && s[i] === s[i - 1] && !VOW.includes(s[i]) && CON[s[i]] !== undefined && s[i] !== 'ь') { if (stressI > i) stressI--; continue; } t += s[i]; } s = t;
  const vpos = [...s].map((c, i) => VOW.includes(c) ? i : -1).filter(i => i >= 0);
  if (stressI < 0 && vpos.length === 1) stressI = vpos[0];
  const cuts = [];
  for (let k = 0; k + 1 < vpos.length; k++) {
    const a = vpos[k], b = vpos[k + 1]; const cl = []; for (let i = a + 1; i < b; i++) cl.push(i);
    const cons = cl.filter(i => !'ьъ'.includes(s[i]));
    if (!cons.length) cuts.push(cl.length ? cl[cl.length - 1] + 1 : a + 1);
    else if (s[cons[cons.length - 1]] === 'й') cuts.push(cons[cons.length - 1] + 1);
    else cuts.push(cons[cons.length - 1]);
  }
  const bounds = [0, ...cuts, s.length], syl = [];
  for (let k = 0; k < bounds.length - 1; k++) {
    let part = '';
    for (let i = bounds[k]; i < bounds[k + 1]; i++) {
      const c = s[i], prev = i ? s[i - 1] : '', nxt = s[i + 1] || '';
      const afterCons = prev && !VOW.includes(prev) && !'ьъ'.includes(prev);
      const st = i === stressI;
      if (VOW.includes(c)) {
        let v;
        if (c === 'а') v = 'a'; else if (c === 'о') v = st ? 'o' : 'a'; else if (c === 'у') v = 'u'; else if (c === 'ы') v = 'ih';
        else if (c === 'и') v = 'i'; else if (c === 'э') v = 'e'; else if (c === 'ё') v = HARD.includes(prev) ? 'o' : 'yo';
        else if (c === 'ю') v = HARD.includes(prev) ? 'u' : 'yu'; else if (c === 'я') v = 'ya';
        else { // е
          if (HARD.includes(prev)) v = 'e'; else if (!afterCons) v = 'ye'; else v = st ? 'ye' : 'i';
          if (!st && afterCons && i === s.length - 1) v = HARD.includes(prev) ? 'e' : 'ye';
        }
        part += v;
      } else if (c === 'ь' && nxt && 'яеёюи'.includes(nxt)) part += '';
      else if (c === 'й' && VOW.includes(prev)) part += 'i';
      else part += CON[c] ?? c;
    }
    syl.push(stressI >= bounds[k] && stressI < bounds[k + 1] && vpos.length > 1 ? part.toUpperCase() : part);
  }
  let res = syl.join('-');
  if (s.endsWith('ый')) res = res.replace(/ihi$/i, m => m === 'IHI' ? 'IH' : 'ih');
  else if (s.endsWith('ий')) res = res.replace(/ii$/i, m => m === 'II' ? 'IY' : 'iy');
  return res;
}
const trText = t => (t.match(/[а-яёА-ЯЁ́-]+/g) || []).filter(w => w !== '-').map(wordTr).join(' ');
const fixStress = t => t.replace(/([аеёиоуыэюяАЕЁИОУЫЭЮЯ])['´`]/g, '$1́');

// ---------------- audio ----------------
let audioEl = null;
function speakRu(text) {
  if (window.speechSynthesis) {
    const v = speechSynthesis.getVoices().find(v => /^ru/i.test(v.lang));
    if (v) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/́/g, '')); u.voice = v; u.lang = v.lang; u.rate = .9; speechSynthesis.speak(u); return true; }
  }
  return false;
}
function play(file, text) {
  if (file) { try { audioEl && audioEl.pause(); audioEl = new Audio('audio/' + file); audioEl.play().catch(() => {}); } catch (e) {} return; }
  if (text && !speakRu(text)) toast('No Russian voice on this device');
}
const spkBtn = (file, text) => `<button class="spk" data-play="${esc(file || '')}" data-text="${esc(text || '')}" aria-label="Play">${ICON.spk}</button>`;

// ---------------- data ----------------
const S = {
  days: [], custom: [], view: 'home', deck: 'all', dayOpen: null,
  prog: {cards: {}, stats: {}, prefs: {newPerDay: 15, dir: 'ru'}},
  canWrite: true, installEvt: null
};
let cards = [], cardById = {};
function buildCards() {
  cards = [];
  for (const d of S.days) {
    const sByWord = {};
    for (const s of d.sentences) (sByWord[s.word || '_'] ??= []).push(s);
    for (const w of d.words) {
      cards.push({id: w.id, type: 'word', deck: 'd' + d.id, w, day: d});
      for (const s of (sByWord[w.id] || [])) cards.push({id: s.id, type: 'sent', deck: 'd' + d.id, s, day: d, w});
    }
    for (const s of (sByWord['_'] || [])) cards.push({id: s.id, type: 'sent', deck: 'd' + d.id, s, day: d});
  }
  const cs = [...S.custom].sort((a, b) => (a.created || 0) - (b.created || 0));
  for (const c of cs) {
    const w = {id: 'c-' + c.id, kind: c.g === 'verb' ? 'verb' : (c.g === 'adj' ? 'adj' : 'noun'), g: c.g, ru: c.ru, en: c.en, pr: c.pr || trText(c.ru), custom: true, deckName: c.deck || 'My words', ex: c.ex, exEn: c.exEn};
    cards.push({id: w.id, type: 'word', deck: 'my', w});
  }
  cardById = Object.fromEntries(cards.map(c => [c.id, c]));
}
const inDeck = c => S.deck === 'all' || c.deck === S.deck || (S.deck.startsWith('my:') && c.deck === 'my' && c.w.deckName === S.deck.slice(3));
const st = id => S.prog.cards[id];
function dayStats() { const k = today(); return (S.prog.stats[k] ??= {rev: 0, new: 0}); }

// ---------------- SRS (Anki-style) ----------------
function schedule(prev, grade, now) {
  const c = Object.assign({state: 'new', step: 0, ivl: 0, ease: 2.5, due: 0, reps: 0, lapses: 0}, prev || {});
  if (c.state !== 'review') {
    const steps = c.state === 'relearn' ? [10] : [1, 10];
    const graduate = days => { c.state = 'review'; c.ivl = days; c.due = now + days * DAY; c.step = 0; };
    if (grade === 1) { c.step = 0; c.due = now + steps[0] * MIN; if (c.state === 'new') c.state = 'learn'; }
    else if (grade === 2) { if (c.state === 'new') c.state = 'learn'; c.due = now + Math.round(steps[Math.min(c.step, steps.length - 1)] * 1.5) * MIN; }
    else if (grade === 3) { if (c.state === 'new') c.state = 'learn'; c.step++; if (c.step >= steps.length) graduate(c.state === 'relearn' ? Math.max(1, c.ivl) : 1); else c.due = now + steps[c.step] * MIN; }
    else graduate(c.state === 'relearn' ? Math.max(1, c.ivl) + 1 : 4);
  } else {
    if (grade === 1) { c.lapses++; c.ease = Math.max(1.3, c.ease - .2); c.ivl = Math.max(1, Math.round(c.ivl * .5)); c.state = 'relearn'; c.step = 0; c.due = now + 10 * MIN; }
    else {
      if (grade === 2) { c.ivl = Math.max(c.ivl + 1, Math.round(c.ivl * 1.2)); c.ease = Math.max(1.3, c.ease - .15); }
      if (grade === 3) c.ivl = Math.max(c.ivl + 1, Math.round(c.ivl * c.ease));
      if (grade === 4) { c.ivl = Math.max(c.ivl + 2, Math.round(c.ivl * c.ease * 1.3)); c.ease += .15; }
      c.due = now + c.ivl * DAY;
    }
  }
  c.reps++; c.last = now; c.ease = Math.round(c.ease * 100) / 100;
  return c;
}
function fmtIvl(ms) {
  const m = Math.round(ms / MIN);
  if (m < 60) return m + ' min'; const h = Math.round(m / 60); if (h < 24) return h + ' h';
  const d = Math.round(ms / DAY); if (d < 31) return d + ' d'; const mo = Math.round(d / 30); return mo < 12 ? mo + ' mo' : (d / 365).toFixed(1) + ' y';
}
function counts() {
  const now = Date.now(), eod = endOfToday();
  let learn = 0, rev = 0, fresh = 0;
  for (const c of cards) {
    if (!inDeck(c)) continue; const x = st(c.id);
    if (!x || x.state === 'new') fresh++;
    else if (x.state === 'review') { if (x.due <= eod) rev++; }
    else if (x.due <= now + 20 * MIN) learn++;
  }
  const newLeft = Math.max(0, S.prog.prefs.newPerDay - dayStats().new);
  return {learn, rev, fresh, newToday: Math.min(fresh, newLeft)};
}
let sinceNew = 0;
function pickNext() {
  const now = Date.now(), eod = endOfToday();
  const pool = cards.filter(inDeck);
  const lrn = pool.filter(c => { const x = st(c.id); return x && (x.state === 'learn' || x.state === 'relearn') && x.due <= now; }).sort((a, b) => st(a.id).due - st(b.id).due);
  if (lrn.length) return lrn[0];
  const rev = pool.filter(c => { const x = st(c.id); return x && x.state === 'review' && x.due <= eod; }).sort((a, b) => st(a.id).due - st(b.id).due);
  const newOk = S.prog.prefs.newPerDay - dayStats().new > 0;
  const fresh = newOk ? pool.filter(c => !st(c.id) || st(c.id).state === 'new') : [];
  if (rev.length && (!fresh.length || sinceNew < 3)) { sinceNew++; return rev[0]; }
  if (fresh.length) { sinceNew = 0; return fresh[0]; }
  const ahead = pool.filter(c => { const x = st(c.id); return x && (x.state === 'learn' || x.state === 'relearn') && x.due <= now + 20 * MIN; }).sort((a, b) => st(a.id).due - st(b.id).due);
  return ahead[0] || null;
}

// ---------------- storage ----------------
const LS = 'ru-app-progress-v1', LSW = 'ru-app-mywords-v1';
let saveTimer = null;
function saveProg() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(LS, JSON.stringify(S.prog)); } catch (e) { toast('Could not save progress on this device'); } }, 400);
}
function saveWords() { try { localStorage.setItem(LSW, JSON.stringify(S.custom)); } catch (e) { toast('Could not save on this device'); } }
function loadLocal() {
  try { const p = JSON.parse(localStorage.getItem(LS) || 'null'); if (p && p.cards) S.prog = Object.assign(S.prog, p, {prefs: Object.assign(S.prog.prefs, p.prefs || {})}); } catch (e) {}
  try { S.custom = JSON.parse(localStorage.getItem(LSW) || '[]'); } catch (e) { S.custom = []; }
}
function setupStandalone() {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.view === 'home') render(); });
  window.addEventListener('appinstalled', () => { S.installEvt = null; toast('Installed!'); render(); });
  window.addEventListener('pagehide', () => { try { localStorage.setItem(LS, JSON.stringify(S.prog)); } catch (e) {} });
}
function exportData() {

function importData(file) {

      saveProg(); saveWords(); buildCards(); render(); toast('Backup loaded');

})();

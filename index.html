<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Русский — Zakria's Russian</title>
<meta name="theme-color" content="#F5F3EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
 --bg:#F5F3EF;--surface:#fff;--ink:#1D1B19;--ink2:#4A4540;--muted:#857D73;--line:#ECE7DF;--line2:#F3EFE9;
 --brand:#C2412D;--brand-soft:#FBE9E5;--pr:#2F6FB3;--new:#DDEBFA;--learn:#FCEFC0;--green:#2E8B57;--green-soft:#E3F3E9;
 --m:#2F6FB3;--f:#C4406E;--n:#2E8B57;--pl:#7650A8;--adj:#C27A14;
 --r:18px;--sh:0 1px 2px rgba(30,20,10,.04),0 6px 20px rgba(30,20,10,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pr)}
/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0}
.wrap{max-width:780px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(100px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button,.side nav button{background:none;border:0;cursor:pointer;color:var(--muted)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:4px 0}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--brand)}
@media (min-width:900px){
 .side{display:flex;flex-direction:column;width:250px;flex:none;position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:var(--surface)}
 .side .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;padding:0 10px 22px}
 .side .logo img{width:36px;height:36px;border-radius:10px}
 .side nav{display:flex;flex-direction:column;gap:4px}
 .side nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:600;font-size:15px;text-align:left}
 .side nav button svg{width:22px;height:22px}
 .side nav button.on{background:var(--brand-soft);color:var(--brand)}
 .side nav button:hover:not(.on){background:var(--line2);color:var(--ink)}
 .side .mini{margin-top:auto;padding:14px;border-radius:14px;background:var(--bg);font-size:13px;color:var(--muted)}
 .side .mini b{display:block;font-size:26px;color:var(--ink)}
 .tabbar{display:none}
 .wrap{padding:36px 36px 60px}
}
/* ---------- components ---------- */
.hdr{display:flex;align-items:flex-end;gap:12px;margin:4px 0 18px}
.hdr h1{font-size:28px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.02em}
.hdr .sub{color:var(--muted);font-size:14px;margin-top:2px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin:0 0 14px}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.sec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--ink);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.brand{background:var(--brand)} .btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.soft{background:var(--line2);color:var(--ink)} .btn.wide{width:100%} .btn.sm{padding:8px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.iconbtn{border:0;background:var(--line2);border-radius:99px;width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink2)}
.iconbtn svg{width:20px;height:20px} .iconbtn:hover{background:var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin-bottom:12px}
.chip{flex:none;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;box-shadow:none}
.tag{display:inline-block;color:#fff;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;letter-spacing:.02em;vertical-align:2px}
.t-m{background:var(--m)} .t-f{background:var(--f)} .t-n{background:var(--n)} .t-pl{background:var(--pl)} .t-adj{background:var(--adj)} .t-verb{background:#5b5650} .t-x{background:#9a928a} .t-num{background:var(--pr)}
.c-m{color:var(--m)} .c-f{color:var(--f)} .c-n{color:var(--n)} .c-pl{color:var(--pl)} .c-x{color:var(--ink)}
.s{color:var(--brand)} .nostress .s{color:inherit}
.pr{color:var(--pr);font-weight:600;font-size:14px;letter-spacing:.01em}
.muted{color:var(--muted)} .small{font-size:13px}
.mk{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px} .mk b{font-weight:800}
.note{background:var(--line2);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;color:var(--ink2)}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;outline:none}
input:focus,select:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(47,111,179,.15)}
label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 5px}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:all .2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spk{border:0;background:var(--brand-soft);color:var(--brand);border-radius:99px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.spk svg{width:20px;height:20px} .spk.sm{width:32px;height:32px} .spk.sm svg{width:16px;height:16px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px} th,td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top} thead th{border-top:0;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
details>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px} details>summary::before{content:"›";font-size:20px;color:var(--muted);transition:transform .2s;display:inline-block;width:14px} details[open]>summary::before{transform:rotate(90deg)}
details ul{margin:10px 0 0;padding-left:20px;color:var(--ink2)} details li{margin:6px 0}
/* ---------- home ---------- */
.hero{background:linear-gradient(135deg,#1D1B19,#3a2a24);color:#fff;border-radius:24px;padding:22px;display:flex;gap:18px;align-items:center;box-shadow:var(--sh)}
.hero .muted{color:#cbbfb3}
.ring{flex:none;width:96px;height:96px;position:relative}
.ring svg{transform:rotate(-90deg)} .ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1.05}
.ring b small{font-size:11px;font-weight:500;color:#cbbfb3}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border-radius:16px;box-shadow:var(--sh);padding:14px 16px;cursor:default}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat.click{cursor:pointer} .stat.click:hover{box-shadow:0 0 0 2px var(--line),var(--sh)}
.path{position:relative;padding-left:8px}
.step{display:flex;gap:14px;align-items:center;padding:10px 0;cursor:pointer}
.dot{width:40px;height:40px;border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;background:var(--line2);color:var(--muted);position:relative;z-index:1}
.step.done .dot{background:var(--green);color:#fff} .step.cur .dot{background:var(--brand);color:#fff;box-shadow:0 0 0 5px var(--brand-soft)}
.step.lock{cursor:default;opacity:.55}
.path::before{content:"";position:absolute;left:27px;top:24px;bottom:24px;width:2px;background:var(--line)}
.bar{height:6px;border-radius:9px;background:var(--line2);overflow:hidden;display:flex} .bar i{display:block;height:100%}
/* ---------- flashcards ---------- */
.flash{min-height:470px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:22px}
.flash .meta{align-self:stretch;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.pics{display:flex;justify-content:center;align-items:center;background:var(--bg);border-radius:22px;padding:14px 22px}
.pics img{width:112px;height:112px;margin:0 -6px} .pics.one img{width:150px;height:150px}
.flash .ru{font-size:34px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.flash .en1{font-size:26px;font-weight:700}
.ans{align-self:stretch;border-top:1px dashed var(--line);margin-top:6px;padding-top:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.grades{align-self:stretch;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto}
.grades button{border:0;border-radius:14px;padding:11px 4px;color:#fff;font-weight:700;cursor:pointer}
.grades small{display:block;font-weight:500;opacity:.9;font-size:12px}
.g1{background:#C2412D} .g2{background:#C27A14} .g3{background:#2E8B57} .g4{background:#2F6FB3}
.kbd{font-size:12px;color:var(--muted);text-align:center}
/* ---------- lessons ---------- */
.unit{display:flex;gap:14px;align-items:center;cursor:pointer}
.unit .num{width:52px;height:52px;border-radius:16px;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)} .item:first-child{border-top:0}
.item>img{width:52px;height:52px;flex:none}
.ims{display:flex;flex:none;background:var(--bg);border-radius:12px;padding:4px} .ims img{width:40px;height:40px;margin:0 -3px}
.word{font-size:19px;font-weight:700}
/* ---------- reader ---------- */
.lib{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.lib{grid-template-columns:1fr 1fr}}
.book{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:16px;cursor:pointer;display:flex;gap:14px;align-items:center}
.book img{width:60px;height:60px;flex:none} .book:hover{box-shadow:0 0 0 2px var(--line),var(--sh)}
.toolbar{position:sticky;top:0;z-index:10;background:rgba(245,243,239,.94);backdrop-filter:blur(10px);padding:10px 0;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.reader{font-size:21px;line-height:1.85}
.story p{margin:0 0 4px}
.sent{display:inline;border-radius:8px;transition:background .2s} .sent.playing{background:#FFF1C9}
.trline{display:none;font-size:14px;line-height:1.45;color:var(--muted);margin:2px 0 10px} .showtr .trline{display:block}
.bubbles{display:flex;flex-direction:column;gap:12px}
.bub{display:flex;gap:10px;align-items:flex-end;max-width:88%}
.bub .av{width:38px;height:38px;border-radius:99px;background:var(--surface);box-shadow:var(--sh);flex:none;display:flex;align-items:center;justify-content:center}
.bub .av img{width:28px;height:28px}
.bub .b{background:var(--surface);box-shadow:var(--sh);border-radius:20px 20px 20px 6px;padding:10px 14px;font-size:20px;line-height:1.7}
.bub .who{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.bub.me{align-self:flex-end;flex-direction:row-reverse} .bub.me .b{background:#FFF7E9;border-radius:20px 20px 6px 20px}
.bub .tr2{display:none;font-size:14px;color:var(--muted);line-height:1.4;margin-top:4px} .showtr .bub .tr2{display:block}
.bub .ctl{display:flex;gap:6px;margin-top:4px}
.wd{cursor:pointer;border-radius:6px;padding:0 2px;margin:0 -1px;transition:background .15s,box-shadow .15s}
.st-new{background:var(--new)} .st-learning{background:var(--learn)} .st-known{background:transparent}
.wd:hover{box-shadow:0 0 0 2px rgba(47,111,179,.35)} .wd.sel{box-shadow:0 0 0 2px var(--pr)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap;font-weight:600}
.legend i{display:inline-block;width:14px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
#pop{position:absolute;z-index:40;background:var(--surface);border-radius:20px;box-shadow:0 18px 50px rgba(30,20,10,.22),0 0 0 1px var(--line);padding:16px 18px;width:360px;display:none;font-size:15px;line-height:1.45}
#pop.sheet{position:fixed;left:0;right:0;bottom:0;width:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto}
#pop.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
#pop .w{font-size:28px;font-weight:800;letter-spacing:-.01em}
#pop .mean{font-size:19px;font-weight:700;margin-top:6px}
#pop .ex{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line2)}
#pop .ex .src{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;background:var(--line2);border-radius:12px;padding:3px;gap:3px;margin-top:12px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on[data-st="new"]{background:var(--new);color:var(--pr)} .seg button.on[data-st="learning"]{background:var(--learn);color:#8a6400} .seg button.on[data-st="known"]{background:var(--green-soft);color:var(--green)}
#scrim{position:fixed;inset:0;background:rgba(20,15,10,.25);z-index:35;display:none}
/* ---------- words ---------- */
.counter{display:flex;gap:14px;align-items:center}
.counter .big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.pill{border:0;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer;flex:none}
.pill.new{background:var(--new);color:var(--pr)} .pill.learning{background:var(--learn);color:#8a6400} .pill.known{background:var(--green-soft);color:var(--green)}
</style>
</head>
<body>
<div class="shell">
 <aside class="side" id="side"></aside>
 <div class="main"><div class="wrap" id="app"><div class="empty">Loading…</div></div></div>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="scrim"></div>
<div id="pop"></div>
<div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
// ================= helpers =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const stress = s => esc(s).replace(/(.́|ё|Ё)/g, '<span class="s">$1</span>');
const GN = {m: 'masculine', f: 'feminine', n: 'neuter', pl: 'plural', adj: 'adjective', verb: 'verb', x: 'phrase', num: 'number'};
function marked(t, g) {
  const h = esc(t).replace(/\{([^}]*)\}/g, (_, inner) => {
    if (inner.includes('|')) { const [a, b] = inner.split('|'); return `<span class="mk c-${g}">${a}<b>${b}</b></span>`; }
    return `<span class="mk c-${g}"><b>${inner}</b></span>`;
  });
  return h.replace(/(.́|ё)/g, '<span class="s">$1</span>');
}
const MIN = 60000, DAY = 86400000;
const dkey = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const today = () => dkey(new Date());
const endOfToday = () => { const d = new Date(); d.setHours(23, 59, 59, 999); return d.getTime(); };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200); }
const nk = w => String(w || '').toLowerCase().replace(/́/g, '').replace(/ё/g, 'е').trim();
const WORD_RE = /[А-Яа-яЁё́]+(?:-[А-Яа-яЁё́]+)*/g;
const I = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  learn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>',
  cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="14" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/></svg>',
  read: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 5h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg>',
  words: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  spk: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};

// ---------------- pronunciation (English letters, CAPS = stress) ----------------
const VOW = 'аеёиоуыэюя';
const CON = {б:'b',в:'v',г:'g',д:'d',ж:'zh',з:'z',й:'y',к:'k',л:'l',м:'m',н:'n',п:'p',р:'r',с:'s',т:'t',ф:'f',х:'kh',ц:'ts',ч:'ch',ш:'sh',щ:'shch',ъ:'',ь:"'"};

  let s = raw.replace(/́/g, '');

  if (DEV[s[s.length - 1]]) s = s.slice(0, -1) + DEV[s[s.length - 1]];

  if (stressI < 0 && vpos.length === 1) stressI = vpos[0];

    const a = vpos[k], b = vpos[k + 1]; const cl = []; for (let i = a + 1; i < b; i++) cl.push(i);
    const cons = cl.filter(i => !'ьъ'.includes(s[i]));
    if (!cons.length) cuts.push(cl.length ? cl[cl.length - 1] + 1 : a + 1);
    else if (s[cons[cons.length - 1]] === 'й') cuts.push(cons[cons.length - 1] + 1);
    else cuts.push(cons[cons.length - 1]);

  const bounds = [0, ...cuts, s.length], syl = [];

    let part = '';

      const c = s[i], prev = i ? s[i - 1] : '', nxt = s[i + 1] || '';
      const afterCons = prev && !VOW.includes(prev) && !'ьъ'.includes(prev);
      const st = i === stressI;
      if (VOW.includes(c)) {
        let v;
        if (c === 'а') v = 'a'; else if (c === 'о') v = st ? 'o' : 'a'; else if (c === 'у') v = 'u'; else if (c === 'ы') v = 'ih';
        else if (c === 'и') v = 'i'; else if (c === 'э') v = 'e'; else if (c === 'ё') v = HARD.includes(prev) ? 'o' : 'yo';

}

function schedule(prev, grade, now) {
  const c = Object.assign({state: 'new', step: 0, ivl: 0, ease: 2.5, due: 0, reps: 0, lapses: 0}, prev || {});
  if (c.state !== 'review') {
    const steps = c.state === 'relearn' ? [10] : [1, 10];
    const graduate = days => { c.state = 'review'; c.ivl = days; c.due = now + days * DAY; c.step = 0; };
    if (grade === 1) { c.step = 0; c.due = now + steps[0] * MIN; if (c.state === 'new') c.state = 'learn'; }
    else if (grade === 2) { if (c.state === 'new') c.state = 'learn'; c.due = now + Math.round(steps[Math.min(c.step, steps.length - 1)] * 1.5) * MIN; }
    else if (grade === 3) { if (c.state === 'new') c.state = 'learn'; c.step++; if (c.step >= steps.length) graduate(c.state === 'relearn' ? Math.max(1, c.ivl) : 1); else c.due = now + steps[c.step] * MIN; }
    else graduate(c.state === 'relearn' ? Math.max(1, c.ivl) + 1 : 4);
  } else {
    if (grade === 1) { c.lapses++; c.ease = Math.max(1.3, c.ease - .2); c.ivl = Math.max(1, Math.round(c.ivl * .5)); c.state = 'relearn'; c.step = 0; c.due = now + 10 * MIN; }
    else {
      if (grade === 2) { c.ivl = Math.max(c.ivl + 1, Math.round(c.ivl * 1.2)); c.ease = Math.max(1.3, c.ease - .15); }
      if (grade === 3) c.ivl = Math.max(c.ivl + 1, Math.round(c.ivl * c.ease));
      if (grade === 4) { c.ivl = Math.max(c.ivl + 2, Math.round(c.ivl * c.ease * 1.3)); c.ease += .15; }
      c.due = now + c.ivl * DAY;
    }
  }
  c.reps++; c.last = now; c.ease = Math.round(c.ease * 100) / 100;
  return c;
}
function fmtIvl(ms) {
  const m = Math.round(ms / MIN); if (m < 60) return m + ' min'; const h = Math.round(m / 60); if (h < 24) return h + ' h';
  const d = Math.round(ms / DAY); if (d < 31) return d + ' d'; const mo = Math.round(d / 30); return mo < 12 ? mo + ' mo' : (d / 365).toFixed(1) + ' y';
}

}

function pickNext() {
  const now = Date.now(), eod = endOfToday(), pool = cards.filter(inDeck);
  const lrn = pool.filter(c => { const x = st(c.id); return x && (x.state === 'learn' || x.state === 'relearn') && x.due <= now; }).sort((a, b) => st(a.id).due - st(b.id).due);
  if (lrn.length) return lrn[0];

  const fresh = S.prog.prefs.newPerDay - dayStats().new > 0 ? pool.filter(c => !st(c.id) || st(c.id).state === 'new') : [];

    if (i >= t.sentences.length) { playQueue = null; return; }
    const s = t.sentences[i]; const el = document.querySelector(`[data-sent="${i}"]`); const a = new Audio('audio/' + s.audio); playQueue = a;
    if (el) { (el.querySelector('.b') || el).classList.add('playing'); el.scrollIntoView({block: 'center', behavior: 'smooth'}); }
    i++; a.onended = () => setTimeout(next, 350); a.play().catch(() => { playQueue = null; });
  };
  next();
}
function finishText(id) {
  const t = S.textCache[id]; let n = 0;
  for (const g of Object.values(t.gloss)) { if (isName(g.lemma)) continue; const k = glossKey(g); if (lemmaStatus(k) === 'new') { S.prog.words[k] = 'known'; n++; } }
  S.prog.read[id] = today(); saveProg(); toast(n ? `${n} new words marked as known` : 'Text finished'); render();
}

// ================= WORDS =================
function wordsView() {
  const wc = wordCounts(), all = Object.values(allLemmas()), q = nk(S.q);
  let list = all.map(x => ({...x, s: lemmaStatus(x.k)}));
  if (S.wordFilter !== 'all') list = list.filter(x => x.s === S.wordFilter);
  if (q) list = list.filter(x => nk(x.l).includes(q) || (x.en || '').toLowerCase().includes(q));
  list.sort((a, b) => nk(a.l).localeCompare(nk(b.l), 'ru'));
  const decks = [...new Set(S.custom.map(c => c.deck || 'My words'))]; if (!decks.includes('My words')) decks.unshift('My words');
  return `${header('Words', 'Every dictionary word counts once: all its forms and cases are the same word.')}
  <div class="card"><div class="counter"><div class="big">${wc.known}</div><div class="grow"><div style="font-weight:700">words you know</div><div class="small muted">${wc.learning} learning · ${wc.total - wc.known - wc.learning} new · ${wc.total} met so far</div>
   <div class="bar" style="margin-top:8px"><i style="width:${100 * wc.known / Math.max(1, wc.total)}%;background:var(--green)"></i><i style="width:${100 * wc.learning / Math.max(1, wc.total)}%;background:#f1d57a"></i></div></div></div>
   <p class="small muted" style="margin:10px 0 0">A word becomes <b>known</b> when you mark it in the reader, press “I already know this” / Easy on a new card, or when its card reaches a 3-week interval.</p></div>
  <details class="card"><summary>${I.plus.replace('<svg', '<svg width="18" height="18"')} Add your own word</summary>
   <label>Russian</label><input id="f-ru" placeholder="e.g. соба'ка (type ' after the stressed vowel)" autocomplete="off"><div class="pr" id="f-pr" style="margin-top:6px;min-height:20px"></div>
   <label>English</label><input id="f-en" placeholder="dog" autocomplete="off">
   <label>Type</label><select id="f-g"><option value="m">noun · masculine</option><option value="f">noun · feminine</option><option value="n">noun · neuter</option><option value="verb">verb</option><option value="adj">adjective</option><option value="x">phrase / other</option></select>
   <label>Example (optional)</label><input id="f-ex" placeholder="У меня́ есть соба'ка." autocomplete="off"><input id="f-exen" placeholder="Translation" style="margin-top:6px" autocomplete="off">
   <label>Set</label><input id="f-deck" list="decks" value="My words"><datalist id="decks">${decks.map(d => `<option value="${esc(d)}">`).join('')}</datalist>
   <button class="btn brand wide" id="save" style="margin-top:14px">Add word</button></details>
  <div class="chips">${[['all', 'All ' + wc.total], ['known', 'Known ' + wc.known], ['learning', 'Learning ' + wc.learning], ['new', 'New ' + (wc.total - wc.known - wc.learning)]].map(([k, l]) => `<button class="chip ${S.wordFilter === k ? 'on' : ''}" data-wf="${k}">${l}</button>`).join('')}</div>
  <input id="q" placeholder="Search Russian or English" value="${esc(S.q)}" style="margin-bottom:12px">
  <div class="card">${list.length ? list.slice(0, 400).map(x => `<div class="item"><div class="grow"><div style="font-weight:700;font-size:17px">${stress(x.l)}</div><div class="small"><span class="pr">${esc(trText(x.l))}</span> · <span class="muted">${esc(x.en || '')}</span></div></div>
    <button class="pill ${x.s}" data-cyc="${esc(x.k)}" title="Tap to change">${x.s}</button>${S.custom.some(c => nk(c.ru) === x.k) ? `<button class="iconbtn" style="width:32px;height:32px" data-del="${esc(S.custom.find(c => nk(c.ru) === x.k).id)}" aria-label="Delete">✕</button>` : ''}</div>`).join('') : '<div class="empty">No words here yet</div>'}</div>`;
}
function addWord() {
  const ru = fixStress($('#f-ru').value.trim()), en = $('#f-en').value.trim();
  if (!ru || !en) { toast('Fill in Russian and English'); return; }
  S.custom.push({id: 'w' + Date.now().toString(36), ru, en, g: $('#f-g').value, pr: trText(ru), ex: fixStress($('#f-ex').value.trim()), exEn: $('#f-exen').value.trim(), deck: $('#f-deck').value.trim() || 'My words', created: Date.now()});
  saveWords(); buildCards(); toast('Added: ' + ru.replace(/́/g, '')); render();
}
function delWord(id) { const w = S.custom.find(c => c.id === id); if (!w) return; S.custom = S.custom.filter(c => c.id !== id); delete S.prog.cards['c-' + id]; saveWords(); saveProg(); buildCards(); render(); toast('Deleted'); }

// ================= render & events =================
function render() {
  hidePop(true); shell();
  const v = {home: homeView, settings: settingsView, learn: learnView, review: reviewView, read: readView, words: wordsView}[S.view] || homeView;
  $('#app').innerHTML = v();
  if (S.view === 'words') {
    const ru = $('#f-ru'), g = $('#f-g');
    ru && ru.addEventListener('input', () => {
      const v = fixStress(ru.value.trim()), p = v.replace(/́/g, ''); $('#f-pr').textContent = v ? trText(v) : '';
      if (!ru.dataset.touched && v && !v.includes(' ')) g.value = /(ть|ти|чь)$/.test(p) ? 'verb' : /(ый|ий|ой)$/.test(p) ? 'adj' : /[ая]$/.test(p) ? 'f' : /[ое]$/.test(p) ? 'n' : 'm';
    });
    g && g.addEventListener('change', () => ru.dataset.touched = '1');
    const q = $('#q'); q && q.addEventListener('input', () => { S.q = q.value; const pos = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); });
  }
}
function go(view) { S.view = view; shown = false; if (view === 'learn') S.dayOpen = null; if (view === 'read') S.textOpen = null; render(); scrollTo(0, 0); if (view === 'review') setTimeout(autoplayFront, 60); }
document.addEventListener('click', e => {
  if (e.target.closest('#pop')) {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.play !== undefined) { play(b.dataset.play, b.dataset.text); return; }
    if (b.dataset.st) { readerSet(b.dataset.st); return; }
    if (b.dataset.addread) { readerAdd(); return; }
    return;
  }
  if (e.target.id === 'scrim') { hidePop(true); return; }
  const w = e.target.closest('.wd'); if (w) { showPop(w, true); return; }
  if (!e.target.closest('#pop')) hidePop(true);
  const t = e.target.closest('button,[data-day],[data-go],[data-text],[data-tab]'); if (!t) return;
  const d = t.dataset;
  if (d.tab) return go(d.tab);
  if (d.go) return go(d.go);
  if (d.play !== undefined) return play(d.play, d.text);
  if (d.deck) { S.deck = d.deck; cur = null; shown = false; return render(); }
  if (d.day) { S.view = 'learn'; S.dayOpen = +d.day; render(); return scrollTo(0, 0); }
  if (d.back) { S.dayOpen = null; return render(); }
  if (d.study) { S.deck = d.study; cur = null; return go('review'); }
  if (d.grade) return grade(+d.grade);
  if (d.knowcard) return knowCard();
  if (d.text) { S.view = 'read'; S.textOpen = +d.text; render(); return scrollTo(0, 0); }
  if (d.closetext) { S.textOpen = null; if (playQueue) { playQueue.pause(); playQueue = null; } return render(); }
  if (d.togtr) { S.showTr = !S.showTr; return render(); }
  if (d.tr1 !== undefined) { const b = document.querySelector(`[data-sent="${d.tr1}"] .tr2`); if (b) b.style.display = b.style.display === 'block' ? '' : 'block'; return; }
  if (d.togstress) { S.prog.prefs.stress = S.prog.prefs.stress === false; saveProg(); return render(); }
  if (d.playall) return playAll(S.textCache[S.textOpen]);
  if (d.finish) return finishText(+d.finish);
  if (d.wf) { S.wordFilter = d.wf; return render(); }
  if (d.cyc) { const order = ['new', 'learning', 'known']; const s = lemmaStatus(d.cyc); setLemma(d.cyc, order[(order.indexOf(s) + 1) % 3]); return render(); }
  if (d.del) return delWord(d.del);
  if (t.id === 'show') { shown = true; render(); if (frontDir === 'en') { const b = document.querySelector('.ans .spk'); if (b) b.click(); } return; }
  if (t.id === 'save') return addWord();
  if (t.id === 'export') return exportData();
  if (t.id === 'importBtn') return $('#importFile').click();
  if (t.id === 'install' && S.installEvt) { S.installEvt.prompt(); S.installEvt.userChoice.finally(() => { S.installEvt = null; render(); }); }
});
document.addEventListener('click', e => { const s = e.target.closest('.sent'); if (s && !e.target.closest('.wd') && !S.showTr) { const l = document.querySelector(`[data-trl="${s.dataset.sent}"]`); if (l) l.style.display = l.style.display === 'block' ? '' : 'block'; } });
document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('.wd');
  if (!el || popPinned || !matchMedia('(hover: hover) and (pointer: fine)').matches || innerWidth < 600) return;
  clearTimeout(popTimer); showPop(el, false);
});
document.addEventListener('mouseout', e => {
  if (popPinned || !e.target.closest || !e.target.closest('.wd, #pop')) return;
  clearTimeout(popTimer); popTimer = setTimeout(() => { if (!$('#pop').matches(':hover') && !document.querySelector('.wd:hover')) hidePop(); }, 300);
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'importFile' && e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; return; }
  if (id === 'npd') { S.prog.prefs.newPerDay = +e.target.value; saveProg(); render(); }
  if (id === 'goal') { S.prog.prefs.goal = +e.target.value; saveProg(); render(); }
  if (id === 'dir') { S.prog.prefs.dir = e.target.value; saveProg(); cur = null; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') hidePop(true);
  if (S.view !== 'review' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === ' ' && !shown) { e.preventDefault(); $('#show') && $('#show').click(); }
  else if (shown && '1234'.includes(e.key)) grade(+e.key);
  else if (e.key.toLowerCase() === 'p') { const b = document.querySelector('.flash .spk'); b && b.click(); }
});

// ================= start =================
(async () => {
  loadLocal();
  try {
    const get = async u => (await fetch(u)).json();
    const idx = await get('days/index.json');
    const [days, plan, texts, lex] = await Promise.all([Promise.all(idx.days.map(d => get(d.file))), get('days/plan.json').catch(() => null), get('texts/index.json').catch(() => ({texts: []})), get('days/lexicon.json').catch(() => null)]);
    S.days = days; S.plan = plan; S.texts = texts.texts || []; S.lex = lex;
  } catch (e) { $('#app').innerHTML = '<div class="empty">Could not load the lessons. Check your connection and reopen the app.</div>'; return; }
  buildCards(); render(); setupStandalone();
})();
})();
</script>
